<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simaelw | Under Construction</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
        color: white;
        text-align: center;
      }

      .container {
        padding: 40px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 15px;
        letter-spacing: 2px;
      }

      p {
        font-size: 1.2rem;
        opacity: 0.8;
      }

      .icon {
        font-size: 4rem;
        margin-bottom: 20px;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🚧</div>
      <h1>Under Construction</h1>
      <p>Sto lavorando per costruire qualcosa di fantastico.</p>
    </div>
  </body>
</html>
